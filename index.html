<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Clinic Information System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f7f8;
            color: #222;
        }

        h1 {
            color: #167d75;
        }

        form, .table-container {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #167d75;
            color: white;
        }

        .delete-btn {
            background: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #167d75;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Health Clinic Information System</h1>
    <p>Manage clinic information, doctors, services and contact details.</p>

    <form id="clinicForm">
        <h2 id="formTitle">Add a Clinic</h2>

        <input type="text" id="clinic_name" placeholder="Clinic Name" required>
        <input type="text" id="doctor_name" placeholder="Doctor Name">
        <input type="text" id="address" placeholder="Address">
        <input type="text" id="phone" placeholder="Phone">
        <input type="text" id="services" placeholder="Services">
        <input type="text" id="opening_hours" placeholder="Opening Hours">
        <input type="email" id="email" placeholder="Email">

        <button type="submit">Save Clinic</button>
        <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
    </form>

    <div class="table-container">
        <h2>Clinic Records</h2>
        <p id="status"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Clinic</th>
                    <th>Doctor</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Services</th>
                    <th>Opening Hours</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="clinicTableBody"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
